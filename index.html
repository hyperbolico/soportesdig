<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Galería GIF - Artes Visuales</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    background: #111;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #gif {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw;
    max-height: 100dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    transition: opacity 0.3s ease;
    -webkit-user-drag: none;
    pointer-events: none;
    opacity: 0;
  }

  #gif.visible {
    opacity: 1;
  }

  /* Texto central "haz click para navegar" */
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #eaeaea;
    font-size: clamp(20px, 5vw, 36px);
    letter-spacing: 1px;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.6s ease;
    padding: 0 20px;
    white-space: nowrap;
  }

  #start.oculto {
    opacity: 0;
  }

  /* Botón "?" arriba a la derecha */
  #ayuda {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    color: #eaeaea;
    font-size: 22px;
    font-weight: 500;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s ease, transform 0.2s ease;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  #ayuda:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  #ayuda:active {
    transform: scale(0.92);
  }

  /* Modal flotante */
  #modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 20;
    padding: 20px;
  }

  #modal.activo {
    opacity: 1;
    pointer-events: auto;
  }

  #modal-caja {
    background: rgba(20, 20, 20, 0.8);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 440px;
    width: 100%;
    color: #f0f0f0;
    font-size: clamp(15px, 4vw, 18px);
    line-height: 1.5;
    text-align: center;
    letter-spacing: 0.3px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  #modal-cerrar {
    margin-top: 22px;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: transparent;
    color: #eaeaea;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  #modal-cerrar:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  @media (min-width: 768px) {
    #gif {
      max-width: 90vw;
      max-height: 90vh;
    }
  }
</style>
</head>
<body>

<img id="gif" src="" alt="">
<div id="start">HAZ CLICK PARA NAVEGAR</div>

<button id="ayuda" aria-label="Información">?</button>

<div id="modal" role="dialog" aria-modal="true">
  <div id="modal-caja">
    Trabajos realizados por alumnxs de soportes digitales de la Escuela de Arte y Diseño de la ENES-MORELIA
    <br>
    <button id="modal-cerrar">cerrar</button>
  </div>
</div>

<audio id="audio" src="assets/glitchsound.wav" loop preload="auto"></audio>

<script>
  // Cantidad total de GIFs (01.gif ... 38.gif)
  const TOTAL = 38;

  const gifs = Array.from({ length: TOTAL }, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    return `assets/${n}.gif`;
  });

  const img = document.getElementById('gif');
  const start = document.getElementById('start');
  const audio = document.getElementById('audio');
  const ayuda = document.getElementById('ayuda');
  const modal = document.getElementById('modal');
  const modalCerrar = document.getElementById('modal-cerrar');

  let ultimo = -1;
  let iniciado = false;

  // Precarga de GIFs
  gifs.forEach(src => { const i = new Image(); i.src = src; });

  // Volumen al 30% (baja 70%)
  audio.volume = 0.3;

  function mostrarAleatorio() {
    let i;
    do {
      i = Math.floor(Math.random() * gifs.length);
    } while (i === ultimo && gifs.length > 1);

    ultimo = i;
    img.classList.remove('visible');

    setTimeout(() => {
      img.src = gifs[i];
      img.classList.add('visible');
    }, 150);
  }

  function iniciarExperiencia() {
    if (iniciado) return;
    iniciado = true;

    // Ocultar texto central
    start.classList.add('oculto');

    // Reproducir audio en loop
    audio.play().catch(err => {
      console.warn('No se pudo reproducir el audio:', err);
    });

    // Mostrar el primer GIF
    mostrarAleatorio();
  }

  // Activar con click o toque (primer gesto del usuario)
  let bloqueado = false;

  function alActivar(e) {
    // Ignorar clicks sobre el botón "?" o el modal
    if (e.target.closest('#ayuda') || e.target.closest('#modal')) return;

    if (bloqueado) return;
    bloqueado = true;
    setTimeout(() => { bloqueado = false; }, 250);

    if (!iniciado) {
      iniciarExperiencia();
    } else {
      mostrarAleatorio();
    }
  }

  document.body.addEventListener('touchstart', alActivar, { passive: true });
  document.body.addEventListener('click', alActivar);

  document.addEventListener('gesturestart', e => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
      e.preventDefault();
      if (!iniciado) iniciarExperiencia();
      else mostrarAleatorio();
    }
  });

  // Botón "?" — abre modal
  ayuda.addEventListener('click', (e) => {
    e.stopPropagation();
    modal.classList.add('activo');
  });

  ayuda.addEventListener('touchstart', (e) => {
    e.stopPropagation();
  }, { passive: true });

  // Cerrar modal
  function cerrarModal() {
    modal.classList.remove('activo');
  }

  modalCerrar.addEventListener('click', (e) => {
    e.stopPropagation();
    cerrarModal();
  });

  modal.addEventListener('click', (e) => {
    // Click fuera de la caja cierra
    if (e.target === modal) cerrarModal();
  });
</script>

</body>
</html>
